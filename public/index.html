<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MyYaan | Operations</title><link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="loginView" class="login-page">
    <section class="login-brand"><div class="brand-mark">M</div><div><b>MyYaan</b><span>DRIVE WITH CONFIDENCE</span></div></section>
    <section class="login-card"><p class="eyebrow">OPERATIONS PORTAL</p><h1>Welcome back.</h1><p>Sign in to keep your service floor moving.</p><form id="loginForm"><label>Email<input type="email" id="email" autocomplete="email" placeholder="admin@myyaan.com" required /></label><label>Password<input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required /></label><button class="primary" type="submit">Sign in <span>→</span></button><div id="loginError" class="error"></div></form></section>
  </main>
  <div id="app" class="app hidden">
    <aside class="sidebar"><div class="logo"><div class="brand-mark">M</div><div><b>MyYaan</b><small>OPERATIONS</small></div></div><nav id="nav"><button data-page="overview" class="active">⌂ <span>Overview</span></button><button data-page="orders">▣ <span>Bookings</span></button><button data-page="customers">♙ <span>Customers</span></button><button data-page="vendors">♜ <span>Service partners</span></button><button data-page="payments">◈ <span>Payments</span></button><button data-page="coupons">🏷 <span>Coupons</span></button><div class="nav-label">CONFIGURATION</div><button data-page="services">✦ <span>Services & pricing</span></button><button data-page="settings">⚙ <span>Settings</span></button></nav><button id="logout" class="logout">↪ <span>Sign out</span></button></aside>
    <section class="main"><header><button class="mobile-menu" id="menu">☰</button><div><p class="eyebrow" id="pageCrumb">DASHBOARD</p><h1 id="pageTitle">Good morning, Admin</h1></div><div class="header-actions"><button class="icon-button">⌕</button><button class="icon-button notify">♧</button><div class="avatar">A</div></div></header><div id="content"></div></section>
  </div>
  <div id="modal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close">×</button><div id="modalContent"></div></div></div>
  <div id="toast" class="toast hidden"></div><script src="/app.js"></script>
</body></html>
